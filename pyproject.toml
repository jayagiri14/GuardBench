[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "guardrail-agent"
version = "0.1.0"
description = "Evaluated Guardrail Agent with CI - input/output safety + automated regression testing"
